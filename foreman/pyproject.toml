[project]
name = "foreman"
version = "0.1.0"
description = "Read-only advisor for an AI playing Timberborn through the TimberLive harness"
requires-python = ">=3.11"
dependencies = ["httpx", "numpy", "networkx", "pyyaml", "fastapi", "uvicorn"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
