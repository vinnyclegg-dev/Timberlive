          font-weight: 800;
          letter-spacing: -0.02em;

        }
        #s6-root .body {
          display: block;
          font-size: 34px;
          font-weight: 500;

        (function () {

          tl.to("#s6-win", { scale: 1.06, duration: 4.3, ease: "none" }, 1.2);
          tl.fromTo("#s6-b", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, 2.9);

        })();
