<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s2-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #ece8e1;
          font-family: Montserrat, sans-serif;
        }
        #s2-root .scene {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0e1216;
        }
        #s2-root .world {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
        }
        #s2-root .shot {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #s2-root .shade {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 520px;
          background: linear-gradient(to top, rgba(14, 18, 22, 0.94) 0%, rgba(14, 18, 22, 0.7) 45%, rgba(14, 18, 22, 0) 100%);
        }
        #s2-root .caption {
          position: absolute;
          left: 120px;
          bottom: 110px;
          width: 1300px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        #s2-root .kicker {
          display: block;
          font-family: "JetBrains Mono", monospace;
          font-size: 24px;
          font-weight: 700;
          letter-spacing: 0.14em;
          color: #e0913f;
        }
        #s2-root .head {
          display: block;
          font-size: 92px;
          font-weight: 800;
          letter-spacing: -0.02em;
          line-height: 1.02;
        }
        #s2-root .body {
          display: block;
          font-size: 38px;
          font-weight: 500;
          color: #d9d4cc;
          max-width: 1240px;
        }
      </style>
      <div id="s2-root" data-composition-id="s2-game" data-width="1920" data-height="1080">
        <div class="scene" id="s2-scene">
          <div class="world" id="s2-world" data-layout-allow-overflow>
            <img id="s2-a" class="shot" src="../assets/game-colony.jpg" alt="" />
            <img id="s2-b" class="shot" src="../assets/game-river.jpg" alt="" />
          </div>
          <div class="shade"></div>
          <div class="caption">
            <div id="s2-kicker" class="kicker">IN THE REAL GAME</div>
            <div id="s2-head" class="head">Your AI plays Timberborn</div>
            <div id="s2-body" class="body">Through a mod with player tools only: build, plant, dam and explain every move.</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const world = document.getElementById("s2-world");
          const cam = { scale: 1.0, x: 0, y: 0 };
          function applyCamera() {
            world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
          }
          applyCamera();
          tl.fromTo("#s2-scene", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
          tl.fromTo(cam, { scale: 1.0, x: 0 }, { scale: 1.1, x: -40, duration: 6, ease: "none", onUpdate: applyCamera }, 0);
          tl.fromTo("#s2-b", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.inOut" }, 3.0);
          tl.fromTo("#s2-kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
          tl.fromTo("#s2-head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.55);
          tl.fromTo("#s2-body", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.9);
          window.__timelines["s2-game"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
