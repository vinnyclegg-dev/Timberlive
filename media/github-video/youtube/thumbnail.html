<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0e1216; }
  body { position: relative; font-family: "Arial Black", "Segoe UI Black", Impact, sans-serif; }
  /* The Foreman 3D map (colony, river, badwater, proposed dams) fills the right side. */
  .bg { position: absolute; inset: 0; background: url("bg-map3d.png") 62% 48% / 128% no-repeat; filter: saturate(1.35) contrast(1.08); }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(14, 18, 22, 0.97) 0%, rgba(14, 18, 22, 0.86) 36%, rgba(14, 18, 22, 0) 64%); }
  .beaver { position: absolute; right: -20px; bottom: -70px; height: 560px;
    filter: drop-shadow(0 0 3px #fff7e6) drop-shadow(0 0 3px #fff7e6) drop-shadow(0 0 22px rgba(255, 150, 60, 0.75)) drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6)); }
  .title { position: absolute; left: 48px; top: 54px; width: 900px;
    font-size: 100px; line-height: 0.96; color: #fff; text-transform: uppercase;
    -webkit-text-stroke: 4px #10140f; text-shadow: 0 8px 0 #10140f, 0 12px 30px rgba(0, 0, 0, 0.6); transform: rotate(-2deg); }
  .title .ai { color: #4fd2ff; }
  .title .game { color: #ffc531; }
  .tag { position: absolute; left: 54px; top: 470px; background: #e0913f; color: #10140f; font-size: 34px;
    padding: 8px 22px 10px; border: 4px solid #10140f; border-radius: 12px; transform: rotate(-2deg); box-shadow: 0 6px 0 #10140f; }
  .free { position: absolute; left: 54px; bottom: 56px; color: #ece8e1; font-family: "Segoe UI", Arial, sans-serif; font-weight: 800;
    font-size: 30px; letter-spacing: 0.04em; text-shadow: 0 3px 8px rgba(0, 0, 0, 0.8); }
  .free b { color: #ffc531; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="shade"></div>
  <img class="beaver" src="../../thumbnail/beaver_spark.png">
  <div class="title">Let your <span class="ai">AI</span><br>play<br><span class="game">Timberborn</span></div>
  <div class="tag">3D MAP + AI ADVISOR</div>
  <div class="free"><b>FREE</b> mod · MCP tools · Windows app</div>
</body>
</html>
